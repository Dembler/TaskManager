<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список дел</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Список дел</h1>

    <!-- Форма добавления -->
    <form th:action="@{/add}" th:object="${newTodo}" method="post" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" th:field="*{title}" placeholder="Введите задачу">
            <input type="date" class="form-control ms-2" th:field="*{dateTodo}" required>
            <button class="btn btn-primary ms-2" type="submit">Добавить</button>
        </div>
    </form>

    <a href="/" class="btn btn-secondary me-2">Все задачи</a>
    <a href="/next-week" class="btn btn-primary">Задачи на неделю</a>

    <!-- Кнопка "Удалить всё" -->
    <form th:action="@{/removeAll}" method="post" class="mb-4 text-end">
        <button class="btn btn-danger btn-sm">Удалить всё</button>
    </form>

    <!-- Список задач -->
    <ul class="list-group">
        <li th:each="item : ${allTodos}" class="list-group-item d-flex justify-content-between align-items-center">

            <!-- Форма обновления задачи с датой -->
            <form th:action="@{/update/{id}(id=${item.id})}" method="post" class="d-flex flex-grow-1 me-2 align-items-center">
                <input type="text" name="title" th:value="${item.title}" class="form-control me-2" required>
                <input type="date" name="dateTodo" th:value="${#dates.format(item.dateTodo, 'yyyy-MM-dd')}" class="form-control me-2" required>
                <button class="btn btn-success btn-sm" type="submit">Обновить</button>
            </form>

            <!-- Кнопка удаления -->
            <form th:action="@{/delete/{id}(id=${item.id})}" method="post" class="mb-0">
                <button class="btn btn-danger btn-sm">Удалить</button>
            </form>
        </li>
    </ul>
</div>
</body>
</html>
