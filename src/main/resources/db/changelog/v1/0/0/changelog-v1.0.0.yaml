databaseChangeLog:
  - changeSet:
      id: 1
      author: nikolay
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: date_todo
                  type: date
                  constraints:
                    nullable: false
